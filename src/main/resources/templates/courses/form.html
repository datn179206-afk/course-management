<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${formTitle})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:760px">
    <div class="page-head">
        <h1 th:text="${formTitle}">Thêm khóa học</h1>
    </div>

    <form class="card" method="post" th:action="@{${action}}" th:object="${courseForm}" novalidate>
        <div class="alert alert-error" th:if="${#fields.hasErrors('*')}">
            Dữ liệu chưa hợp lệ, vui lòng kiểm tra lại các trường bên dưới.
        </div>
        <div class="alert alert-info" th:if="${categories.isEmpty()}">
            Chưa có loại khóa học nào. Hãy <a th:href="@{/categories/create}">thêm loại khóa học</a> trước.
        </div>

        <div class="field">
            <label for="name">Tên khóa học *</label>
            <input type="text" id="name" th:field="*{name}">
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label for="categoryId">Loại khóa học *</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">-- Chọn loại khóa học --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <div class="field">
            <label for="tuitionFee">Học phí (₫) *</label>
            <input type="number" id="tuitionFee" th:field="*{tuitionFee}" step="any">
            <div class="field-error" th:if="${#fields.hasErrors('tuitionFee')}" th:errors="*{tuitionFee}"></div>
        </div>

        <div class="field">
            <label for="duration">Thời lượng (giờ) *</label>
            <input type="number" id="duration" th:field="*{duration}">
            <div class="field-error" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
        </div>

        <div class="field checkbox">
            <input type="checkbox" id="active" th:field="*{active}">
            <label for="active">Đang tuyển sinh</label>
        </div>

        <div class="field">
            <label for="description">Mô tả</label>
            <textarea id="description" rows="4" th:field="*{description}"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="actions">
            <button type="submit" class="btn">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/courses}">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
