<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${formTitle})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:640px">
    <div class="page-head">
        <h1 th:text="${formTitle}">Thêm loại khóa học</h1>
    </div>

    <form class="card" method="post" th:action="@{${action}}" th:object="${category}" novalidate>
        <div class="field">
            <label for="name">Tên loại khóa học *</label>
            <input type="text" id="name" th:field="*{name}">
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="field">
            <label for="description">Mô tả</label>
            <textarea id="description" rows="3" th:field="*{description}"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="actions">
            <button type="submit" class="btn">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/categories}">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
