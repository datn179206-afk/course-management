spring.application.name=course-management
server.port=8080

# ===== SQL Server (instance SQLEXPRESS, database CourseDb) =====
# Doi password cho dung voi mat khau cua user sa tren may ban
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=CourseDb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Abc@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Tu dong tao bang neu chua co
spring.jpa.hibernate.ddl-auto=update
# Bat buoc de luu tieng Viet co dau (nvarchar)
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
